version: '3.9'
services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:4000/api
    depends_on:
      - backend
